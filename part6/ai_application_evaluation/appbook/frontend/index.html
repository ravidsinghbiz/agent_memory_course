<!doctype html>
<html lang="en" data-theme="dark" data-sidebar="collapsed">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Application Evaluation Studio</title>
  <meta name="description" content="Evaluate chatbot, RAG, workflow, agent, and autonomous-agent form factors with transparent metrics and persisted evidence." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d12'/%3E%3Cpath d='M7 23V14m6 9V8m6 15V11m6 12V5' stroke='%237c5cff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    (function(){
      try {
        var theme=localStorage.getItem("aieval6-theme")||"dark";
        var sidebar=localStorage.getItem("aieval6-sidebar")==="expanded"?"expanded":"collapsed";
        document.documentElement.dataset.theme=theme;
        document.documentElement.dataset.sidebar=sidebar;
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <button class="mobile-scrim" id="mobile-scrim" hidden aria-label="Close navigation"></button>
  <section class="explorer" id="data-explorer" aria-label="Evaluation data explorer">
    <button class="explorer-handle" id="explorer-toggle" aria-expanded="false" aria-controls="explorer-body">
      <span class="explorer-title"><b>DB</b><strong>Data Explorer</strong><em id="explorer-summary">Connecting…</em></span>
      <span class="explorer-live"><i></i><span>Persisted evaluation evidence</span></span>
      <span class="chevron">⌃</span>
    </button>
    <div class="explorer-body" id="explorer-body" hidden>
      <aside class="explorer-list">
        <header><span>Allowlisted tables</span><button id="explorer-refresh" title="Refresh">↻</button></header>
        <div id="explorer-tables"></div>
      </aside>
      <section class="explorer-data">
        <header id="explorer-table-head">Select a table</header>
        <div class="explorer-scroll"><table id="explorer-grid"></table></div>
      </section>
      <aside class="explorer-activity">
        <header>Recent runs</header>
        <div id="explorer-activity"></div>
      </aside>
    </div>
  </section>
  <script src="/app.js"></script>
</body>
</html>
